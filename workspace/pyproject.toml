[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svkm-voice-assistant"
version = "1.0.0"
description = "AI-powered multilingual voice assistant for SVKM NMIMS Global University, Dhule"
requires-python = ">=3.11"
authors = [
    {name = "SVKM NMIMS Development Team", email = "dev@svkmnmimsgu.ac.in"}
]
license = {text = "Proprietary"}

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.1",
    "pgvector>=0.2.4",

    # Cache
    "redis[hiredis]>=5.0.1",

    # Azure
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-cognitiveservices-speech>=1.35.0",
    "openai>=1.10.0",  # Azure OpenAI via OpenAI SDK

    # AI
    "anthropic>=0.18.0",

    # Data validation
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",

    # Utilities
    "httpx>=0.26.0",
    "tenacity>=8.2.3",
    "python-jose[cryptography]>=3.3.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",

    # Parsing
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "pypdf>=4.0.1",
    "pytesseract>=0.3.10",  # OCR fallback
    "markdown>=3.5.2",

    # Observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43b0",
    "opentelemetry-instrumentation-redis>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "azure-monitor-opentelemetry>=1.2.0",

    # Structured logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "httpx>=0.26.0",  # For test client
    "faker>=22.6.0",

    # Code quality
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",

    # Type stubs
    "types-python-dateutil>=2.8.19",
    "types-pytz>=2024.1",
    "types-redis>=4.6.0",
    "types-beautifulsoup4>=4.12.0",

    # Development tools
    "ipython>=8.20.0",
    "ipdb>=0.13.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "ARG001", # unused function argument
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["ARG", "S"]  # test-specific relaxations

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "azure.*",
    "anthropic.*",
    "openai.*",
    "pgvector.*",
    "pytesseract.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=apps",
    "--cov=packages",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires database/redis)",
    "contract: Contract tests (provider adapters with fixtures)",
    "e2e: End-to-end tests (requires full stack)",
    "slow: Slow tests (>1 second)",
    "requires_credentials: Tests requiring real provider credentials",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apps", "packages"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
