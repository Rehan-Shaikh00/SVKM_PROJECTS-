- slug: faq-programmes-not-offered-here
  category: faq
  subcategory: programmes
  title: "Commerce, management and law programmes this university does not run"
  aliases: ["B.Com", "M.Com", "BBA LLB", "law degree", "MBA", "B.Sc", "CLAT",
            "बी कॉम", "एमबीए", "एलएलबी", "कायदा", "science degree"]
  title_localized:
    hi-IN: "बी.कॉम, एमबीए या कानून की पढ़ाई यहां नहीं है"
    mr-IN: "बी.कॉम, एमबीए किंवा कायद्याचा अभ्यासक्रम येथे नाही"
  academic_year: "2026-27"
  language: en-IN
  tags: [faq, not-offered, commerce, law, management, escalate]
  verified: true
  verified_by: "svkmnmimsgu.ac.in programme list, admission enquiry form and handouts"
  source: "https://www.svkmnmimsgu.ac.in/"
  structured:
    not_offered:
      - "B.Com (Hons) and its specialisations, including ACCA, CMA and International Accounting"
      - "M.Com"
      - "BBA LL.B. (Hons) or any law degree"
      - "A standalone MBA at this university"
      - "B.Sc. programmes"
    offered_instead:
      - "BBA (3 years, intake 60)"
      - "BCA (3 years, intake 60)"
      - "B.Tech + MBA (Technology Management), a 5-year dual degree"
      - "B.Pharm + MBA (Pharma Tech), a 5-year dual degree"
      - "MCA, M.Tech, M.Pharm and Ph.D. programmes"
    assistant_instruction: "Do not offer a fee, an entrance route or a seat count for these. Management study at this university exists only inside the B.Tech + MBA and B.Pharm + MBA dual degrees. Law, B.Com and a standalone MBA are associated with SVKM's NMIMS (Deemed to be University) and its School of Commerce campus at Dhule, which is a separate institution with its own admission authority; if that is what the caller wants, say so and give them the university's number rather than guessing."
  body: |
    SVKM NMIMS Global University at Dhule does not run B.Com in any
    specialisation, M.Com, a law degree such as BBA LL.B., a B.Sc., or a
    standalone MBA. In the School of Commerce it offers the three year BBA and the
    three year BCA. Management study at this university exists inside two dual
    degrees, the five year B.Tech plus MBA in Technology Management and the five
    year B.Pharm plus MBA in Pharma Tech, and at postgraduate level through the
    MCA, M.Tech and M.Pharm. Programmes such as B.Com honours, BBA LL.B. honours
    and the MBA are associated with SVKM's NMIMS, the deemed to be university in
    Mumbai, and with its School of Commerce campus at Dhule, which is a separate
    institution with its own admission authority, its own entrance tests and its
    own fee structure. Nothing about those programmes can be confirmed from this
    university's office.
