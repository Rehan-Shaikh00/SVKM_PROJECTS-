# ============================================================================
# SCHOOL OF COMMERCE (SOC)  —  started A.Y. 2024-25
# ============================================================================
# Source of truth: https://www.svkmnmimsgu.ac.in/commerce-admission-handout
# plus the programme list on https://www.svkmnmimsgu.ac.in/ (retrieved 2026-09-18).
#
# This school offers exactly TWO programmes: BBA and BCA. Earlier drafts of this
# knowledge base carried B.Com (Hons), BBA LL.B. (Hons), M.Com, MBA and B.Sc
# records sourced from aggregators. Those belong to SVKM's NMIMS (Deemed to be
# University) Mumbai and its School of Commerce campus at Dhule — a DIFFERENT
# legal entity on a different campus — and have been removed, because quoting
# another institution's programmes on this university's admissions line is
# exactly the hallucination this system exists to prevent.

