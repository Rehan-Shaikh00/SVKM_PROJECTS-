  body: |
    The School of Commerce started in the academic year 2024-25 and offers two
    three year undergraduate programmes on the semester pattern for the academic
    year 2026-27: the Bachelor of Business Administration with an intake of sixty,
    and the Bachelor in Computer Applications with an intake of sixty. Both ask
    for ten plus two from a recognised board in Arts, Commerce or Science with at
    least fifty per cent in aggregate, and Mathematics is not compulsory for
    either. Selection is based on the MAH-CET score for BBA, BCA and BMS, the NPAT
    score, or the PERA test, and the university publishes round-wise merit lists
    for both programmes. Teaching is in English and both programmes are full time
    on campus.

