  body: |
    SVKM NMIMS Global University is a state private university at Dhule in
    Maharashtra, and describes itself as Dhule's newest state private university
    and an extension of the SVKM NMIMS legacy. It is run by Shri Vile Parle
    Kelavani Mandal, the trust behind the NMIMS institutions. The campus is at
    Survey Number four ninety nine, Plot Numbers one, two and three, behind the
    Gurudwara, near the Mumbai to Agra National Highway, Dhule four two four zero
    zero one. The university has three schools: the School of Commerce, which
    started in the academic year 2024-25, the School of Technology, Management and
    Engineering, and the School of Pharmacy and Technology Management, both of
    which started in the academic year 2025-26. Its stated vision is to be a
    world renowned institution of higher learning dedicated to excellence in
    education, research and innovation with social responsibility, and its mission
    covers an inclusive learning environment for students from diverse
    backgrounds, state of the art pedagogy with interdisciplinary collaboration,
    and the values of ethics and community engagement. Admission registration for
    the academic year 2026-27 runs through the SVKM admission portal linked from
    the university website.

- slug: university-recognition
  category: university
  subcategory: accreditation
  title: "Accreditation and approvals"
  aliases: ["accreditation", "NBA", "NAAC", "is it recognised", "approval",
            "man्यता", "प्रमाणन", "मान्यता", "AICTE", "PCI"]
  title_localized:
    hi-IN: "मान्यता और प्रमाणन"
    mr-IN: "मान्यता आणि प्रमाणन"
  academic_year: "2026-27"
  language: en-IN
  tags: [university, accreditation, nba, naac]
  verified: true
  verified_by: "svkmnmimsgu.ac.in/accreditations"
  source: "https://www.svkmnmimsgu.ac.in/accreditations"
  structured:
    nba: "Computer Engineering, Civil Engineering, Electrical Engineering, Mechanical Engineering and the Diploma Programme (D.Pharm.) at SVKM's Institute of Technology on this campus are accredited by the National Board of Accreditation from AY 2024-25 to AY 2026-27."
    naac: "SVKM's Institute of Pharmacy on this campus is accredited in its first cycle with an A+ grade, CGPA 3.43, by the National Assessment and Accreditation Council."
    attribution_note: "Both accreditations are published on the university's own accreditations page and belong to the SVKM institutes operating on this campus, not to the university as a whole."
    statutory_approvals: "Engineering programmes require AICTE approval, pharmacy programmes require Pharmacy Council of India approval, and the university is established as a state private university in Maharashtra."
    assistant_instruction: "Attribute the NBA and NAAC status to the named institute and the named programmes exactly as the accreditations page does. Do not say the university itself holds an A+ NAAC grade, and do not claim a programme is accredited unless it appears in that list."
  body: |
    The university publishes two accreditations on its own website. The National
    Board of Accreditation has accredited five programmes of SVKM's Institute of
    Technology on this campus from the academic year 2024-25 to 2026-27: Computer
    Engineering, Civil Engineering, Electrical Engineering, Mechanical
    Engineering, and the Diploma Programme in Pharmacy. Separately, SVKM's
    Institute of Pharmacy on this campus is accredited by the National Assessment
    and Accreditation Council in its first cycle with an A plus grade and a CGPA
    of three point four three. Both accreditations belong to the named SVKM
    institutes operating on this campus rather than to the university as a whole,
    and statutory approval for a specific programme and intake year is granted
    separately: engineering programmes require All India Council for Technical
    Education approval and pharmacy programmes require Pharmacy Council of India
    approval. The current approval status of a specific programme and intake year
    is confirmed by the university, because approvals are granted per programme
    and per year.

