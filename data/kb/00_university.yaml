    The campus is on the Mumbai Agra National Highway at Dhule, behind the
    Gurudwara. By air, the nearest airport is at Aurangabad, also called Chh.
    Sambhajinagar, roughly one hundred and fifty seven kilometres from Dhule, and
    it is well connected to Mumbai, Nagpur and New Delhi. By road, Dhule is about
    three hundred and thirty kilometres from Mumbai, three hundred and fifty five
    kilometres from Pune, two hundred and twenty five kilometres from Indore and
    two hundred and thirty kilometres from Surat. By rail, a traveller coming from
    New Delhi on a train passing through Bhusawal gets down at Bhusawal Railway
    Station and continues by road via Jalgaon to Dhule, which is a journey of
    about one hundred and twenty five kilometres. The university's contact page
    does not mention a campus bus or shuttle service, so pickup arrangements are
    confirmed by the school offices.

- slug: faq-global-university-vs-other-svkm-nmims
  category: faq
  subcategory: disambiguation
  title: "SVKM NMIMS Global University Dhule is not the NMIMS School of Commerce Dhule, and not the SVKM institutes on the same campus"
  aliases: ["which NMIMS Dhule", "same as NMIMS Mumbai", "deemed university",
            "SVKM Institute of Technology", "SVKM Institute of Pharmacy",
            "global university vs school of commerce", "कोणते एनआयएमएस"]
  title_localized:
    hi-IN: "ग्लोबल यूनिवर्सिटी और एनएमआईएमएस स्कूल ऑफ कॉमर्स में अंतर"
    mr-IN: "ग्लोबल युनिव्हर्सिटी आणि एनआयएमएस वाणिज्य शाळा यांतील फरक"
  academic_year: "2026-27"
  language: en-IN
  tags: [faq, disambiguation, escalate]
  verified: true
  verified_by: "svkmnmimsgu.ac.in programme list, handouts and accreditations page"
  source: "https://www.svkmnmimsgu.ac.in/"
  structured:
    question: "Is SVKM NMIMS Global University, Dhule the same as the NMIMS School of Commerce at Dhule, or as SVKM's Institute of Technology and Institute of Pharmacy at Dhule?"
    answer: "No. Three different SVKM NMIMS operations are associated with Dhule, and only one of them is this university."
    this_university_offers:
      - "B.Tech, B.Tech + MBA, M.Tech, MCA and Ph.D. (Technology) in the School of Technology, Management & Engineering"
      - "D.Pharm, B.Pharm, B.Pharm + MBA, B.Tech Cosmetic Technology, M.Pharm and Ph.D. (Pharmaceutical Science) in the School of Pharmacy & Technology Management"
      - "BBA and BCA in the School of Commerce"
    other_entities:
      - "SVKM's NMIMS (Deemed to be University), Mumbai, and its School of Commerce campus at Dhule, which is where B.Com (Hons) and BBA LL.B. (Hons) belong"
      - "SVKM's Institute of Technology and SVKM's Institute of Pharmacy at Dhule, whose NBA and NAAC accreditations are published on this university's website"
    assistant_instruction: "Never quote another entity's programmes, entrance tests or fees as this university's. If the caller wants B.Com, law, or a standalone MBA, say those belong to the deemed university and its Dhule commerce campus, and give this university's number for confirmation."
  body: |
    Callers often confuse three separate SVKM NMIMS operations associated with
    Dhule. The first is this institution, SVKM NMIMS Global University, a state
    private university whose own programmes are listed on its website: B.Tech and
    the B.Tech plus MBA dual degree, M.Tech, MCA and a Ph.D. in Technology in the
    School of Technology, Management and Engineering; D.Pharm, B.Pharm, the
    B.Pharm plus MBA dual degree, B.Tech in Cosmetic Technology, M.Pharm and a
    Ph.D. in Pharmaceutical Science in the School of Pharmacy and Technology
    Management; and BBA and BCA in the School of Commerce. The second is SVKM's
    NMIMS, the deemed to be university based in Mumbai, whose School of Commerce
    has a campus at Dhule, and that is where B.Com honours and the integrated
    BBA LL.B. honours belong, with their own admission authority, entrance tests
    and fee structure. The third is SVKM's Institute of Technology and SVKM's
    Institute of Pharmacy at Dhule, whose NBA and NAAC accreditations are
    published on this university's accreditations page. Only the first entity's
    programmes, intakes and admission process can be confirmed from this
    university's office.

- slug: policy-escalation-boundaries
  category: policy
  subcategory: assistant_scope
  title: "What the AI assistant may and may not answer"
  aliases: ["assistant scope", "escalation policy"]
  academic_year: "2026-27"
  language: en-IN
  tags: [policy, internal]
  verified: true
  verified_by: "System policy"
  source: "Internal assistant policy"
  structured:
    assistant_may_answer: "Programmes, intakes, eligibility, entrance tests, the admission process and portal, documents, accreditations, contact numbers, the campus address, directions, and campus facilities where the website publishes them."
    must_escalate_to_human:
      - "Any fee question — the university publishes no fee table, so no amount may be quoted"
      - "Individual fee disputes, refunds and instalment hardship — accounts office"
      - "Seat confirmation, document verification outcomes and candidature decisions — admissions office"
      - "Grievances, complaints, harassment, discrimination or any legal matter"
      - "Scholarship eligibility decisions and disbursement status"
      - "Hostel availability, charges and room allotment — not published on the website"
      - "Anything the knowledge base does not cover or that is not marked verified"
    never_state: "Exact cut offs, seat allotment outcomes, refund amounts, hostel charges, or any fee or date that is not in the knowledge base and marked verified."
  body: |
    The assistant answers only from the knowledge base and escalates whenever a
    question is individual, financial, legal or unverified. Fee disputes, refunds
    and instalment hardship go to the accounts office. Seat confirmation,
    document verification outcomes and candidature decisions go to the admissions
    office. Grievances, complaints, harassment, discrimination and legal matters
    are handed to a person immediately without the assistant attempting an answer.
    Exact cut offs, allotment outcomes and refund amounts are never stated by the
    assistant.

