    city: "Dhule"
    state: "Maharashtra"
    type: "State private university"
    legacy: "An extension of the SVKM NMIMS legacy, run by Shri Vile Parle Kelavani Mandal"
    schools:
      - "School of Commerce (started A.Y. 2024-25)"
      - "School of Technology, Management & Engineering (from A.Y. 2025-26)"
      - "School of Pharmacy & Technology Management (from A.Y. 2025-26)"
    website: "https://www.svkmnmimsgu.ac.in"
    admission_portal: "https://sdcappscs.svkm.ac.in:44300/irj/portal"
