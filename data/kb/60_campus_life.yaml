  body: |
    The campus is at Survey Number four ninety nine behind the Gurudwara on the
    Mumbai Agra National Highway at Dhule, and holds all three schools of the
    university: Commerce, Technology Management and Engineering, and Pharmacy
    and Technology Management. What the university's own website publishes about
    facilities is a Facilities link that opens a gallery of library photographs,
    with no text on holdings, timings or capacity, a virtual tour with video
    walkthroughs of the campus, and programme level information for each school.
    A detailed list of laboratories, sports facilities, canteen, medical room or
    transport is not published on the website, so those cannot be confirmed
    here. If you would like to see the campus, the virtual tour link can be sent
    to you by message, and the school office confirms a specific facility and
    arranges a visit.
- slug: anti-ragging-policy
  category: policy
  subcategory: safety
  title: "Anti-ragging policy and how to report"
  aliases: ["ragging", "ragging complaint", "bullying", "harassment", "safety",
            "रॅगिंग", "रैगिंग", "शेगाई", "परेशान", "तक्रार"]
  title_localized:
    hi-IN: "रैगिंग विरोधी नीति"
    mr-IN: "रॅगिंग विरोधी धोरण"
  academic_year: "2026-27"
  language: en-IN
  tags: [policy, safety, ragging, escalate]
  verified: false
  verified_by: null
  source: "No anti-ragging committee contact or policy document is published on the university website. The statutory framework is the UGC Regulations on Curbing the Menace of Ragging in Higher Educational Institutions."
  structured:
    statutory_framework: "Ragging is prohibited in Indian higher education under the UGC Regulations on Curbing the Menace of Ragging in Higher Educational Institutions, which require every institution to constitute an anti-ragging committee and an anti-ragging squad, and to publish undertaking and affidavit requirements for students and parents."
    how_to_report:
      - "Tell a person at the university immediately — the school office or the hostel and student affairs function"
      - "The national anti-ragging helpline and the online complaint portal operated under the UGC framework"
      - "The local police, in an emergency"
    assistant_instruction: "A report of ragging is passed straight to a person, with the details of the call handed over at the same time. Do not attempt to resolve it on the call, do not ask the caller to wait, and do not minimise what has been reported. The university's own committee contacts are not published on the website, so never invent a name, a number or an email for them."
  body: |
    Ragging is prohibited in Indian higher education under the UGC regulations on
    curbing the menace of ragging, which require an institution to constitute an
    anti ragging committee and an anti ragging squad and to collect undertakings
    from students and parents. The university website does not publish its
    committee membership or a complaint contact, so no name, number or email
    address for them can be given here. A student or parent who has experienced or
    witnessed ragging should tell a person at the university immediately, use the
    national anti ragging helpline and online complaint portal operated under the
    UGC framework, or contact the local police in an emergency. A report of
    ragging made on this line is passed straight to a person, with the details of
    the call handed over at the same time, and it is not something to settle on
    the phone or to wait on.
