# ============================================================================
# CAMPUS LIFE  —  hostel, facilities, safety
# ============================================================================
# The university website (retrieved 2026-09-18) publishes an About page, a
# contact page with a "How to reach" section, an accreditations page, an academic
# calendar, a library page under Facilities, a virtual tour and an admission
# enquiry form. It publishes NOTHING about hostel accommodation, hostel charges,
# hostel rules or mess.
#
# Earlier drafts of this file asserted that hostel accommodation is available with
# separate boys' and girls' blocks. That came from aggregator listings for other
# institutes at Dhule, not from the university, and on a live admissions line it
# is a promise this office cannot keep. The hostel record below therefore states
# the position honestly: not published, confirmed by the school office. The
# transport record that used to live here has moved to 00_university.yaml, where
# it is sourced from the university's own "How to reach" section.

