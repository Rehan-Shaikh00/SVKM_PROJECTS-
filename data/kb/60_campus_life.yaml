  source: "https://www.svkmnmimsgu.ac.in/"
  structured:
    # Spoken aloud by the facilities frame, so these are nouns, not sentences:
    # "The campus has Library — the university website's Facilities section leads
    # to its library page, …" was unreadable. The explanation lives in the body.
    facilities:
      - "the library"
      - "a virtual tour of the campus"
      - "academic blocks for all three schools"
    published_detail: false
    virtual_tour: "The homepage offers a See Virtual Tour link with video walkthroughs of the campus."
    library_page: "The Facilities link opens a gallery of library photographs only; no holdings, timings or capacity are published."
