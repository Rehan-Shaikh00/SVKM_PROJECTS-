            "is admission still open", "selection list", "waiting list",
            "शेवटची तारीख", "मुदत", "आखिरी तारीख", "कब तक", "तारीख", "वेळापत्रक",
            "मेरिट लिस्ट", "गुणवत्ता सूची", "चयन सूची", "राउंड", "प्रवेश अभी खुला है",
            "मेरिट यादी", "गुणवत्ता यादी", "निवड यादी", "फेरी", "प्रवेश सुरू आहे"]
  title_localized:
    hi-IN: "प्रवेश की तारीखें"
    mr-IN: "प्रवेशाच्या तारखा"
  academic_year: "2026-27"
  language: en-IN
  tags: [admission, dates, schedule, escalate]
  verified: true
  verified_by: "svkmnmimsgu.ac.in homepage admission announcements"
  source: "https://www.svkmnmimsgu.ac.in/"
  structured:
    how_it_works: "Every date for AY 2026-27 is published as a per-programme PDF schedule on the university website, under Admission Announcements for each school, and a separate schedule is issued for each round."
    # Read off the Admission Announcements tabs on the university homepage on
    # 17 September 2026. Each school is at a different round, so the rounds are
    # recorded per programme group rather than as one blanket statement.
    rounds_running_for_ay_2026_27:
      - "B.Tech and B.Tech + MBA: schedules and merit lists published for Round I, Round II and Round III"
      - "Direct Second Year B.Tech: schedules for Round I and Round II, with an extended schedule issued for Round I, and merit lists for both rounds"
      - "M.Tech: admission schedules published for Round I and Round II"
      - "MCA: schedules and merit lists published for Round I and Round II"
      - "Pharmacy — D.Pharm, B.Pharm, B.Pharm + MBA, B.Tech Cosmetic Technology and Direct Second Year B.Pharm: schedules and final merit lists published up to Round III, and M.Pharm up to Round II"
      - "BBA and BCA: first, second and third round merit lists published, with an admission schedule and document list for the School of Commerce"
      - "Spot admission for the School of Technology, Management & Engineering"
      - "Ph.D. entrance test notice and the list of candidates qualified for the fall session"
    how_to_get_current_dates: "The Admission Announcements section of https://www.svkmnmimsgu.ac.in/ lists the schedule and merit list PDFs for each school and round, and the school office numbers on the contact page confirm the position in the current round."
    assistant_instruction: "Do not state a specific date, deadline or last date unless it is recorded here and marked verified. Describe the round mechanism, say where the schedule PDF is published, and offer to send the link by SMS or connect the caller to the school office."
  body: |
    Every admission date for the academic year 2026-27 is published on the
    university website as a schedule PDF for a specific programme and a specific
    round, in the Admission Announcements section for each school, so there is no
    single last date that applies to everything. For this cycle the School of
    Technology, Management and Engineering has published schedules and merit lists
    up to round three for B.Tech and B.Tech plus MBA, up to round two for M.Tech,
    MCA and direct second year B.Tech, and a spot admission announcement. The
    School of Pharmacy and Technology Management has published schedules and final
    merit lists up to round three for D.Pharm, B.Pharm, B.Pharm plus MBA, B.Tech
    Cosmetic Technology and direct second year B.Pharm, and up to round two for
    M.Pharm. The School of Commerce has published first, second and third round
    merit lists for BBA and BCA along with an admission schedule and a document
    list. For the doctoral programmes there is a Ph.D. entrance test notice with
    the list of candidates qualified for the fall session. Because each round gets
    its own PDF and schedules are sometimes extended, the current position for a
    programme is read from that programme's latest schedule on the website, or
    confirmed by the school office, rather than from memory.

