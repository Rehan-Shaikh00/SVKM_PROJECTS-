# ============================================================================
# ADMISSIONS  —  process, tests, eligibility, documents, dates
# ============================================================================
# Source of truth: the three school-wise admission handouts and the homepage
# Admission Announcements on https://www.svkmnmimsgu.ac.in/ (retrieved 2026-09-18).
#
# What is verified here: the online portal, the round-based merit lists, the
# qualifying tests per programme family, and the published eligibility. What is
# NOT verified: an application fee amount, a document list transcribed from the
# published PDFs, and any specific calendar date — the website publishes those as
# per-programme PDF schedules that change round by round, so the assistant points
# to them instead of reciting a date it cannot stand behind.

- slug: admission-process-overview
  category: admission_process
  subcategory: steps
  title: "How admission works, step by step"
  aliases: ["how to apply", "admission process", "apply online", "registration",
            "प्रवेश प्रक्रिया", "अर्ज कसा भरावा", "एडमिशन कैसे लें", "आवेदन"]
  title_localized:
    hi-IN: "प्रवेश प्रक्रिया"
    mr-IN: "प्रवेश प्रक्रिया"
  academic_year: "2026-27"
  language: en-IN
  tags: [admission, process, apply, portal]
  verified: true
  verified_by: "svkmnmimsgu.ac.in admission handouts and homepage admission announcements"
  source: "https://www.svkmnmimsgu.ac.in/technology-admission-handout"
  structured:
    application_mode: "Online, through the SVKM admission portal"
    apply_url: "https://sdcappscs.svkm.ac.in:44300/irj/portal"
    steps:
      - "Register online on the SVKM admission portal for AY 2026-27"
      - "Choose the school and the programme, and appear for one of its qualifying tests"
      - "Wait for the round-wise merit list published on the university website"
      - "Follow the published admission schedule for that round and submit the listed documents"
      - "If a round is missed, later rounds and spot admission are published as announcements"
    rounds_published_for_ay_2026_27:
      - "Round I, Round II and Round III schedules and merit lists for B.Tech, B.Tech + MBA, M.Tech, MCA, D.Pharm, B.Pharm, B.Pharm + MBA, B.Tech Cosmetic Technology and M.Pharm"
      - "Direct Second Year schedules and merit lists for B.Tech, B.Tech + MBA, B.Pharm and B.Pharm + MBA"
      - "Spot admission for the School of Technology, Management & Engineering"
      - "Ph.D. entrance test notice and the list of qualified candidates for the fall session"
    enquiry: "Admission enquiry form on the website, or the school office numbers published on the contact page."
    assistant_instruction: "Give the mechanism, the portal and the school number. Never state a deadline, a cut off or an allotment outcome; the website publishes round schedules as PDFs that change."
  body: |
    Admission for the academic year 2026-27 is entirely online. The applicant
    registers on the SVKM admission portal linked from the university website,
    chooses the school and the programme, and appears for one of the qualifying
    tests that programme accepts. The university then publishes round-wise merit
    lists on its website, and each list is accompanied by an admission schedule
    for that round which sets out the dates, the reporting procedure and the
    document list for that programme. For the academic year 2026-27 the university
    has published round one, round two and round three schedules and merit lists
    across the engineering, pharmacy and commerce programmes, separate direct
    second year schedules and merit lists for B.Tech, B.Tech plus MBA, B.Pharm and
    B.Pharm plus MBA, a spot admission announcement for the School of Technology,
    Management and Engineering, and for the doctoral programmes a Ph.D. entrance
    test notice with the list of candidates qualified for the fall session.
    Applicants who miss a round watch the admission announcements section of the
    website, and can call the school office for the position in the current round.

- slug: admission-entrance-tests
  category: entrance_exam
  subcategory: tests
  title: "Entrance tests accepted, by programme"
  aliases: ["entrance exam", "which exam", "MHT CET", "JEE", "NPAT", "PERA test",
            "NCET", "GPAT", "GATE", "NEET", "MAH CET", "प्रवेश परीक्षा", "परीक्षा"]
  title_localized:
    hi-IN: "प्रवेश परीक्षाएं"
    mr-IN: "प्रवेश परीक्षा"
  academic_year: "2026-27"
  language: en-IN
  tags: [admission, entrance-exam, tests]
  verified: true
  verified_by: "svkmnmimsgu.ac.in admission handouts"
  source: "https://www.svkmnmimsgu.ac.in/technology-admission-handout"
  structured:
    tests:
      - "B.Tech and B.Tech + MBA: MHT-CET (PCM), JEE Main, JEE Advanced, NCET (NMIMS-CET), SAT, PERA TEST (PCM)"
      - "M.Tech: GATE or PERA TEST"
      - "MCA: MAH-MCA-CET or PERA TEST (MCA)"
      - "BBA and BCA: MAH-CET (BBA/BCA/BMS), NPAT, PERA TEST"
      - "B.Pharm, B.Pharm + MBA and B.Tech Cosmetic Technology: MHT-CET (PCM/PCB), NEET (PCB), NCET (NMIMS-CET), SAT, PERA TEST (PCM/PCB)"
      - "D.Pharm: no entrance test, merit on 10+2 marks in Physics, Chemistry and the higher of Mathematics or Biology"
      - "M.Pharm: GPAT or PERA TEST"
      - "Ph.D.: NET, GATE or GPAT as applicable, or the university's own test, then a personal interview"
    university_test: "PERA TEST and NCET (NMIMS-CET) are the tests conducted by the NMIMS group; the Ph.D. entrance test is conducted by SVKM NMIMS Global University itself."
    assistant_instruction: "Name only the tests listed for the programme asked about, and say that the round-wise merit list follows. Do not state a cut off score or a percentile."
  body: |
    The qualifying test depends on the programme. For B.Tech and the B.Tech plus
    MBA dual degree, selection is based on the score in MHT-CET for PCM, JEE Main,
    JEE Advanced, NCET which is the NMIMS-CET, SAT, or the PERA test for PCM. For
    M.Tech it is GATE or the PERA test. For MCA it is the MAH-MCA-CET or the PERA
    test for MCA. For BBA and BCA in the School of Commerce it is the MAH-CET for
    BBA, BCA and BMS, NPAT, or the PERA test. For B.Pharm, the B.Pharm plus MBA
    dual degree and B.Tech in Cosmetic Technology it is MHT-CET for PCM or PCB,
    NEET for PCB, NCET, SAT or the PERA test. The Diploma in Pharmacy has no
    entrance test at all, and is filled on merit from the ten plus two marks in
    Physics, Chemistry and the higher of Mathematics or Biology. For M.Pharm it is
    GPAT or the PERA test. For the doctoral programmes a candidate must have
    qualified NET, or GATE for technology and GPAT for pharmaceutical science, or
    the entrance test conducted by the university, and selection then follows a
    personal interview. Round-wise merit lists are published on the website after
    the tests.

- slug: admission-eligibility-summary
  category: eligibility
  subcategory: summary
  title: "Eligibility summary by level"
  aliases: ["eligibility", "am I eligible", "minimum marks", "qualification",
            "पात्रता", "किती गुण", "टक्केवारी", "शैक्षणिक अर्हता", "आवश्यक गुण"]
  title_localized:
    hi-IN: "पात्रता की जानकारी"
    mr-IN: "पात्रतेची माहिती"
  academic_year: "2026-27"
  language: en-IN
  tags: [admission, eligibility, marks]
  verified: true
  verified_by: "svkmnmimsgu.ac.in admission handouts"
  source: "https://www.svkmnmimsgu.ac.in/technology-admission-handout"
  structured:
    undergraduate: "B.Tech and B.Tech + MBA: 10+2 with English, Physics and Mathematics plus one of Chemistry, a technical vocational subject, Computer Science, Information Technology, Informatics Practices or Engineering Graphics, with at least 45% in Physics, Mathematics and Chemistry or the vocational subject, or 40% for Backward Class Categories, EWS and Persons with Disability candidates. BBA and BCA: 10+2 in Arts, Commerce or Science from a recognised board with at least 50% in aggregate, Mathematics not compulsory."
    pharmacy_undergraduate: "B.Pharm and B.Pharm + MBA: 10+2 with English as one subject and Physics, Chemistry, Mathematics or Biology as optional subjects individually. B.Tech Cosmetic Technology and D.Pharm: 10+2 with Physics, Chemistry and either Mathematics or Biology or both as major subjects. No minimum percentage is published for these in the AY 2026-27 handout."
    postgraduate: "M.Tech: a bachelor's degree in the relevant field of Engineering and Technology from an AICTE or Central or State Government approved institution with at least 55%, or 45% for Backward Class Categories, EWS and PwD candidates. MCA: a bachelor's degree in a relevant field such as BCA or Computer Science, or B.Sc., B.Com. or B.A. with Mathematics at 10+2 or graduation level, with at least 50%, or 45% for those categories. M.Pharm: B.Pharm from a PCI-approved institution of an Indian university established by law with not less than 55% over the four years, plus State Pharmacy Council registration."
    doctoral: "Ph.D.: a master's degree or an equivalent professional degree with at least 55% in aggregate or grade B on the UGC 10-point scale, and a qualified NET, GATE or GPAT score or the university's own test, followed by a personal interview."
    reserved_categories: "The lower percentages published in the handouts apply to Backward Class Categories, the Economically Weaker Section and Persons with Disability candidates. Caste or category claims require the certificates the university asks for at the time of admission."
    assistant_instruction: "Quote only the percentage published for the programme asked about, and mention the relaxed percentage for the reserved categories where the handout publishes one. Cut off scores and merit positions are never stated."
  body: |
    Eligibility depends on the level. For B.Tech and the B.Tech plus MBA dual
    degree a candidate must have passed ten plus two or an equivalent examination
    with English as a compulsory subject, Physics and Mathematics, and one of
    Chemistry, a technical vocational subject, Computer Science, Information
    Technology, Informatics Practices or Engineering Graphics, with at least forty
    five per cent in Physics, Mathematics and Chemistry or the vocational subject,
    reduced to forty per cent for Backward Class Categories, Economically Weaker
    Section and Persons with Disability candidates. For BBA and BCA the requirement
    is ten plus two in Arts, Commerce or Science from a recognised board with at
    least fifty per cent in aggregate, and Mathematics is not compulsory. For
    B.Pharm and the B.Pharm plus MBA the requirement is ten plus two with English
    as one of the subjects and Physics, Chemistry, Mathematics or Biology as
    optional subjects individually, while for B.Tech in Cosmetic Technology and the
    Diploma in Pharmacy it is ten plus two with Physics, Chemistry and either
    Mathematics or Biology or both as major subjects. The handout for this cycle
    publishes no minimum percentage for the pharmacy programmes. At postgraduate
    level, M.Tech asks for a bachelor's degree in the relevant field of
    Engineering and Technology from an approved institution with at least fifty
    five per cent, or forty five per cent for the reserved categories; MCA asks
    for a relevant bachelor's degree, or a B.Sc., B.Com. or B.A. with Mathematics
    at ten plus two or graduation level, with at least fifty per cent, or forty
    five per cent for those categories; and M.Pharm asks for a B.Pharm from a
    Pharmacy Council of India approved institution of an Indian university
    established by law with not less than fifty five per cent over the four years,
    together with State Pharmacy Council registration. For the Ph.D. a candidate
    needs a master's degree or an equivalent professional degree with at least
    fifty five per cent or grade B on the UGC ten point scale, a qualified NET,
    GATE or GPAT score or the university's own test, and then a personal
    interview.

- slug: admission-documents-required
  category: documents
  subcategory: checklist
  title: "Documents required for admission"
  aliases: ["documents", "certificates needed", "what to bring", "document list",
            "कागदपत्रे", "डॉक्युमेंट्स", "प्रमाणपत्र", "दस्तावेज", "कागजपत्र"]
  title_localized:
    hi-IN: "प्रवेश के लिए आवश्यक दस्तावेज"
    mr-IN: "प्रवेशासाठी आवश्यक कागदपत्रे"
  academic_year: "2026-27"
  language: en-IN
  tags: [admission, documents, checklist]
  verified: false
  verified_by: null
  source: "The university publishes a separate document-list PDF per programme (first year and direct second year lists differ); those PDFs are the authority and are not transcribed here."
  structured:
    documents_required:
      - "Class 10 mark sheet and certificate, as proof of date of birth"
      - "Class 12 mark sheet and certificate"
      - "Qualifying entrance test score card"
      - "Graduation or post-graduation mark sheets and the degree or provisional certificate, for PG and doctoral applicants"
      - "Diploma mark sheets and the diploma certificate, for direct second year applicants"
      - "Transfer certificate and migration certificate where applicable"
      - "Caste or category certificate and a non-creamy layer certificate where a relaxed percentage or a reserved seat is claimed"
      - "Government photo identity proof"
      - "State Pharmacy Council registration, for M.Pharm applicants"
    official_lists: "A separate document list PDF is published for each programme on the university website, and first year and direct second year candidates have different lists."
    assistant_instruction: "Read this as a typical list only, say that the university publishes a programme specific document list on its website, and offer to send the link or the list by SMS. Never confirm that a caller's own documents are sufficient; that verification is done by the admissions office."
  body: |
    The university publishes a separate document list for each programme on its
    website, and the list for first year candidates differs from the one for
    direct second year candidates, so the published PDF for the specific programme
    is the authority. A typical list covers the class ten mark sheet and
    certificate as proof of date of birth, the class twelve mark sheet and
    certificate, the score card of the qualifying entrance test, graduation and
    post graduation mark sheets with the degree or provisional certificate for
    postgraduate and doctoral applicants, diploma mark sheets and the diploma
    certificate for direct second year applicants, the transfer certificate and
    migration certificate where applicable, a caste or category certificate and a
    non creamy layer certificate where a relaxed percentage or a reserved seat is
    claimed, and a government photo identity proof. Applicants to the Master of
    Pharmacy also need registration with the State Pharmacy Council, or must
    obtain it within one month of admission, failing which the admission is
    cancelled. Whether a specific set of documents is sufficient is decided by the
    admissions office when they are verified.

