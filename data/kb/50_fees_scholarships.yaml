# ============================================================================
# FEES, SCHOLARSHIPS AND LOANS
# ============================================================================
# THE UNIVERSITY WEBSITE PUBLISHES NO FEE TABLE. The three school-wise admission
# handouts at svkmnmimsgu.ac.in list programme, intake, duration, pattern,
# eligibility and qualifying tests — and no fee column. The only statement about
# cost on the site is qualitative: the homepage says the fee structure is
# "competitively moderate … compared to other private colleges of engineering in
# India".
#
# The numbers that circulate on aggregator sites (BBA ₹2.75L / ₹4.44L, B.Tech
# ₹3.5L / ₹3.93L, M.Pharm ₹5.08L, and so on) describe *other* institutions:
# SVKM's Institute of Technology and SVKM's Institute of Pharmacy at Dhule, which
# are AICTE/PCI institutes, and SVKM's NMIMS Mumbai, the deemed university. They
# also contradict each other. They have all been REMOVED from this knowledge base,
# because a fee quoted on a live admissions line is the single most damaging thing
# this assistant could invent. Every fee question now escalates, and offers the
# portal, the school office and an SMS instead.

- slug: fees-structure-policy
  category: fees
  subcategory: policy
  title: "Fees are not published on the university website"
  aliases: ["fees", "fee structure", "how much does it cost", "tuition",
            "फीस", "शुल्क", "किती फी", "खर्च", "fee kitni", "shulk"]
  title_localized:
    hi-IN: "शुल्क की जानकारी"
    mr-IN: "शुल्काची माहिती"
  academic_year: "2026-27"
  language: en-IN
  tags: [fees, policy, escalate]
  verified: true
  verified_by: "svkmnmimsgu.ac.in handouts publish no fee column; homepage states the fee structure is competitively moderate"
  source: "https://www.svkmnmimsgu.ac.in/technology-admission-handout"
  structured:
    published_fee_table: false
    website_claim: "The university's homepage describes its fee structure as competitively moderate compared to other private colleges of engineering in India."
    where_the_fee_is_confirmed:
      - "The SVKM admission portal at the time of registration and offer, https://sdcappscs.svkm.ac.in:44300/irj/portal"
      - "The school office for the programme asked about"
      - "The admission offer letter and the fee schedule issued with it"
    aggregator_warning: "Fee figures on third-party college listing sites refer to SVKM's Institute of Technology, SVKM's Institute of Pharmacy or SVKM's NMIMS Mumbai, and they disagree with each other. None of them is a fee for this university."
    assistant_instruction: "Never quote an amount, an annual figure, a total, an instalment plan or a comparison with another college. Say the fee is not published on the website, give the portal and the school office number, and offer to connect the caller or send the contact details by SMS. Escalate the call as fee_not_in_kb."
  body: |
    The university does not publish a fee table on its website. The admission
    handouts for the School of Technology, Management and Engineering, the School
    of Pharmacy and Technology Management and the School of Commerce list the
    programme, the intake, the duration, the pattern, the eligibility and the
    qualifying tests, but no fee. The only statement about cost on the website is
    on the homepage, which describes the fee structure as competitively moderate
    compared with other private colleges of engineering in India. The fee for a
    specific programme and academic year is confirmed at the time of registration
    and offer through the SVKM admission portal, by the school office, and in the
    offer letter with the fee schedule attached to it. Fee figures published on
    third party college listing sites describe other SVKM institutions at Dhule or
    the NMIMS deemed university in Mumbai, they disagree with one another, and
    none of them is a fee for this university.

