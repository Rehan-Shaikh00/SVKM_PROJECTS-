    mr-IN: "शुल्क परत आणि प्रवेश रद्द करणे"
  academic_year: "2026-27"
  language: en-IN
  tags: [fees, refund, withdrawal, escalate]
  verified: false
  verified_by: null
  source: "No refund or withdrawal policy is published on the university website."
  structured:
    published: false
    decided_by: "The accounts office, against whatever refund schedule the university notifies for that cycle."
    assistant_instruction: "Never state a refund amount, a percentage or a refund deadline. Record the caller's situation in the escalation brief and connect them to the accounts office."
  body: |
    The university website does not publish a refund or withdrawal policy, so no
    refund amount, percentage or deadline can be stated. A refund depends on when
    the withdrawal is made against the cut off dates the university notifies for
    that cycle, on whether a seat has already been allotted and confirmed, and on
    the components already paid, and the accounts office decides each case. If you want to withdraw, if you have been offered a seat elsewhere, or if
    you are disputing a charge, the accounts office handles it, and it
    helps to have the payment details and the offer letter to hand.

- slug: scholarships-available
  category: scholarships
  subcategory: schemes
  title: "Scholarships and fee concessions"
  aliases: ["scholarship", "concession", "fee waiver", "post matric", "शिष्यवृत्ती",
            "छात्रवृत्ति", "स्कॉलरशिप", "सवलत", "शुल्क सवलत"]
  title_localized:
    hi-IN: "छात्रवृत्ति की जानकारी"
    mr-IN: "शिष्यवृत्तीची माहिती"
  academic_year: "2026-27"
  language: en-IN
  tags: [scholarships, financial-aid, escalate]
  verified: false
  verified_by: null
  source: "The university website publishes no scholarship list; these are the government schemes a Maharashtra student would normally apply through."
  structured:
    scholarship_types:
      - "Government of Maharashtra post-matric scholarship schemes for reserved categories and economically weaker sections"
      - "National Scholarship Portal central schemes"
      - "Merit based concessions, where the university notifies them for a cycle"
      - "Minority, defence ward and disability schemes run by the respective authorities"
    how_they_work: "Government schemes are applied for on the state scholarship portal or the National Scholarship Portal, and the institute verifies and forwards the application. A caste or category certificate, an income certificate and, where applicable, a non-creamy layer certificate are normally required."
    published_by_university: false
    assistant_instruction: "Explain the categories and where to apply, say that the university website publishes no scholarship list for this cycle, and never confirm that a particular student is eligible for or will receive a specific scholarship or amount. Connect the caller to the school office for an individual assessment."
  body: |
    The university website does not publish a list of scholarships or fee
    concessions for this cycle, so what follows is the general position for a
    student studying in Maharashtra rather than a promise from this university.
    Government of Maharashtra post matric schemes support students from reserved
    categories and economically weaker sections, and central government merit and
    means based schemes run through the National Scholarship Portal. Both are
    applied for on the relevant portal, with the institute verifying and
    forwarding the application, and both normally require a caste or category
    certificate, an income certificate and, where applicable, a non creamy layer
    certificate. Merit based concessions and any scheme run by the trust or the
    NMIMS group depend on what the university notifies for the cycle. Minority,
    defence ward and disability schemes are run by their own authorities. Whether
    a particular student qualifies, and how much is payable, is decided by the
    scheme authority and confirmed by the school office, not on a phone call.

- slug: education-loans
  category: loan_payment
  subcategory: loans
  title: "Education loans"
  aliases: ["education loan", "student loan", "bank loan", "शिक्षण कर्ज",
            "लोन", "कर्ज", "बँक कर्ज"]
  title_localized:
    hi-IN: "शिक्षण ऋण"
    mr-IN: "शैक्षणिक कर्ज"
  academic_year: "2026-27"
  language: en-IN
  tags: [loans, finance, escalate]
  verified: false
  verified_by: null
  source: "The university website publishes no loan tie-up, interest rate or bonafide procedure."
  structured:
    published_by_university: false
    what_the_university_can_issue: "A bonafide certificate and the fee structure for the programme, which lenders normally require, are issued by the school or accounts office."
    assistant_instruction: "Never quote an interest rate, an eligible loan amount, a repayment term or an approval outcome. Explain that the lender decides, suggest the borrower approach their own bank first, and connect the caller to the school office for the bonafide certificate and fee structure a lender asks for."
  body: |
    The university website does not publish a loan tie-up, an interest rate or a
    procedure for education loans, so none of those can be stated. An education
    loan is the lender's decision, and the interest rate, the eligible amount, the
    repayment term and the approval all depend on the bank and on the borrower.
    Approaching the borrower's own bank first is usually the quickest route, and
    the National Credit Portal lists the schemes a lender can use. What the
    university side can provide is the documentation a lender asks for, namely a
    bonafide certificate and the fee structure for the programme, which are issued
    by the school office or the accounts office once admission is confirmed.
