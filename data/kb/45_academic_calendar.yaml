  body: |
    The university publishes an academic calendar for 2026-27, signed by the
    Vice-Chancellor. Classes for the first semester begin on 13 July 2026 for
    Pharmacy, 27 July 2026 for Engineering and 29 July 2026 for Commerce. Term
    end examinations run from 01 December to 24 December 2026, and the semester
    break follows from 26 December 2026 to 02 January 2027. The even semester
    begins on 04 January 2027, its term end examinations run from 15 May to 10
    June 2027, and the next academic year commences on 12 July 2027. Between the
    semesters there is a Diwali break from 07 November to 14 November 2026, a
    sports day from 07 January to 09 January 2027 and cultural events from 14
    January to 16 January 2027. The calendar also notes that detailed school-wise
    schedules are communicated by the Examination Department and that preparation
    leave varies by school, so if you need the exact dates for your own school and
    semester, the calendar can be sent to you and the school office confirms them.
    These are teaching dates. Admission deadlines are published separately, per
    programme and per round, and are not part of this calendar.
