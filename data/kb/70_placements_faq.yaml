    mr-IN: "प्लेसमेंटची माहिती"
  academic_year: "2026-27"
  language: en-IN
  tags: [placements, jobs, escalate]
  verified: true
  verified_by: "seed:svkmnmimsgu.ac.in"
  verified_at: "2026-09-18T00:00:00+05:30"
  verification_note: "svkmnmimsgu.ac.in homepage, Why Choose Us section"
  source: "https://www.svkmnmimsgu.ac.in/"
  structured:
    website_claim: "The university's homepage states '100% job placement. Students gain hands-on experience.'"
    published_detail: false
    not_published:
      - "A placement report, placement percentage or number of offers"
      - "Highest, average or median package"
      - "A recruiter list or the names of visiting companies"
      - "A description of a training and placement cell and its activities"
      - "Internship policy or stipend details"
    assistant_instruction: "Attribute the 100% placement line to the university's website rather than stating it as an outcome, and never quote a percentage, a package, a recruiter name or a number of offers of your own. Say what is not published, and offer to connect the caller to the school office, which handles placement questions for its programmes."
  body: |
    The university's homepage states, under its reasons to choose the university,
    that there is one hundred per cent job placement and that students gain hands
    on experience. That is a claim published on the university's own website, and
    it is the only placement statement the website makes. No placement report,
    placement percentage, number of offers, highest or average package, recruiter
    list or description of a training and placement cell and its activities is
    published there, so none of those figures can be given. Placement questions
    about a specific programme, including internships and how recruitment is
    coordinated, are answered by the school office for that programme, on the
    numbers published on the university's contact page.

