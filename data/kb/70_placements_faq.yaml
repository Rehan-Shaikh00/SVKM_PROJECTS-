    Every programme the university publishes is full time on campus at Dhule. The
    handouts describe a semester pattern for B.Tech, B.Tech plus MBA, M.Tech, MCA,
    B.Pharm, B.Pharm plus MBA, B.Tech in Cosmetic Technology, M.Pharm, BBA and
    BCA, and an annual pattern for the Diploma in Pharmacy. The doctoral
    programmes run for a minimum of three years, with intake as per the
    availability of supervisors. No online degree, distance mode programme, part
    time taught programme or weekend batch is published, so none of them should be
    described as available here. Some programmes run by other NMIMS group
    campuses are delivered in other modes, but those are a different campus with a
    different approval, and nothing about them can be confirmed from this
    university's office.

- slug: faq-transfer-and-programme-change
  category: faq
  subcategory: transfers
  title: "Changing programme, transferring campus, deferring admission"
  aliases: ["branch change", "transfer", "change of programme", "defer admission",
            "campus transfer", "शाखा बदल", "प्रवेश बदल", "ट्रांसफर", "branch बदल"]
  title_localized:
    hi-IN: "शाखा बदलना या ट्रांसफर"
    mr-IN: "शाखा बदलणे किंवा स्थानांतर"
  academic_year: "2026-27"
  language: en-IN
  tags: [faq, transfer, escalate]
  verified: false
  verified_by: null
  source: "The university website publishes no branch change, transfer, deferral or migration policy."
  structured:
    published: false
    decided_by: "The school office and the admissions function of the university, case by case."
    cross_entity_note: "A move to SVKM's NMIMS in Mumbai or to its School of Commerce campus at Dhule is not an internal transfer, because those are separate legal entities with their own admission authorities."
    assistant_instruction: "Never promise a branch change, a campus transfer, a deferral or a refund. Capture what the caller wants and why, record it in the escalation brief, and connect them to the school office."
  body: |
    The university website publishes no policy on changing programme after
    admission, on transferring between branches or schools, on deferring admission
    to a later year, or on migrating to another university, so none of those can
    be promised on a call. Each is decided case by case by the school office and
    the university's admissions function, against seat availability, eligibility
    for the programme wanted and the applicable ordinance, and a deferral may
    involve the fee already paid. A move to SVKM's NMIMS in Mumbai or to its
    School of Commerce campus at Dhule is not an internal transfer at all, because
    those are separate legal entities with their own admission authorities, and it
    would need a fresh admission with each of them. Migration to a different
    university mid programme is governed by that university's rules and normally
    involves a migration certificate and a no objection process. Tell the school office what you want and why, and they take it from there.

