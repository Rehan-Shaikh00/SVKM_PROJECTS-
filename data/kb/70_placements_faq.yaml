# ============================================================================
# PLACEMENTS AND FREQUENTLY ASKED QUESTIONS
# ============================================================================
# The university website publishes no placement report, no recruiter list, no
# package figure and no description of a training and placement cell. What it does
# publish, under "Why Choose Us?" on the homepage, is the claim "100% job
# placement. Students gain hands-on experience." That is recorded below as a
# website claim to be attributed, not as an outcome to be asserted.
#
# The earlier draft of this file described a placement cell, pre-placement
# training, mock interviews and recruiter drives. None of that is on the
# university's website, so it has been removed rather than left in as plausible
# filler.

