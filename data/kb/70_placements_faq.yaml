  language: en-IN
  tags: [faq, catalogue, courses]
  verified: true
  verified_by: "seed:svkmnmimsgu.ac.in"
  verified_at: "2026-09-18T00:00:00+05:30"
  verification_note: "svkmnmimsgu.ac.in programme list and admission enquiry form"
  source: "https://www.svkmnmimsgu.ac.in/"
  structured:
    schools:
      - "School of Commerce: BBA and BCA, three years each, sixty seats each"
      - "School of Technology, Management & Engineering: B.Tech in six branches, B.Tech + MBA in three branches, M.Tech in four branches, MCA and Ph.D."
      - "School of Pharmacy & Technology Management: D.Pharm, B.Pharm, B.Pharm + MBA, B.Tech Cosmetic Technology, M.Pharm in four specialisations and Ph.D."
    programme_count: "Twenty-six programmes are listed across the three schools, including the doctoral programmes in technology and pharmaceutical science."
    assistant_instruction: "Give the school and the programmes relevant to what the caller asked about, and offer the intake and eligibility for a named programme. Do not add B.Com, law, a standalone MBA or any medical programme; see the record on programmes this university does not run."
  body: |
    The university runs three schools. The School of Commerce offers the three
    year BBA and the three year BCA, with sixty seats each. The School of
    Technology, Management and Engineering offers four year B.Tech programmes in
    Computer Engineering, Computer Science and Engineering in Artificial
    Intelligence and Machine Learning, Computer Science and Engineering in Data
    Science, Civil Engineering, Electrical Engineering and Mechanical
    Engineering, a five year B.Tech plus MBA in Technology Management in three of
    those branches, two year M.Tech programmes in Civil, Computer, Electrical and
    Mechanical Engineering, a two year MCA and a Ph.D. in Technology and
    Engineering, and it also lists Information Technology at undergraduate, dual
    degree and M.Tech level. The School of Pharmacy and Technology Management
    offers the two year Diploma in Pharmacy, the four year Bachelor of Pharmacy,
    the five year B.Pharm plus MBA in Pharma Tech, the four year B.Tech in
    Cosmetic Technology, the two year M.Pharm in Pharmaceutics, Pharmaceutical
    Quality Assurance, Pharmacology and Pharmaceutical Chemistry, and a Ph.D. in
    Pharmaceutical Science. All of them are full time on campus and taught in
    English.

