    three five zero six two zero, nine four two five six, eight five nine six six,
    and nine seven six four four, zero five zero six nine. For the School of
    Pharmacy and Technology Management they are zero two five six two, three five
    zero six four zero, nine one five eight nine, four seven nine nine nine, and
    eight six six eight five, zero one four nine six. For the School of Commerce
    they are zero two five six two, three five zero six zero zero, nine two seven
    two one, one zero zero seven three, and eight seven eight eight seven, zero one
