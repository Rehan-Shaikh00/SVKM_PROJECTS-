- slug: faq-no-medical-programmes
  category: faq
  subcategory: programmes
  title: "Medical, dental, nursing and allied health programmes are not offered"
  aliases: ["MBBS", "BDS", "nursing", "physiotherapy", "medical college",
            "एमबीबीएस", "बीडीएस", "नर्सिंग", "मेडिकल", "doctor course", "आयुष"]
  title_localized:
    hi-IN: "एमबीबीएस, बीडीएस या नर्सिंग की सुविधा नहीं"
    mr-IN: "एमबीबीएस, बीडीएस किंवा नर्सिंग अभ्यासक्रम उपलब्ध नाही"
  academic_year: "2026-27"
  language: en-IN
  tags: [faq, medical, not-offered, escalate]
  verified: true
  verified_by: "seed:svkmnmimsgu.ac.in"
  verified_at: "2026-09-18T00:00:00+05:30"
  verification_note: "svkmnmimsgu.ac.in programme list and admission handouts"
  source: "https://www.svkmnmimsgu.ac.in/"
  structured:
    not_offered:
      - "MBBS"
      - "BDS / dental"
      - "B.Sc. Nursing"
      - "Physiotherapy (BPT)"
      - "Ayurveda, Homeopathy and other AYUSH degrees"
      - "Paramedical and allied health science degrees"
    offered_instead:
      - "Diploma in Pharmacy (D.Pharm)"
      - "Bachelor of Pharmacy (B.Pharm)"
      - "B.Pharm + MBA (Pharma Tech)"
      - "B.Tech (Cosmetic Technology)"
      - "M.Pharm and Ph.D. in Pharmaceutical Science"
    assistant_instruction: "Say clearly that these programmes are not offered, name the pharmacy alternatives, and never invent an entrance route, fee or seat count for a programme the university does not run."
  body: |
    SVKM NMIMS Global University does not run MBBS, BDS or any dental programme,
    nursing, physiotherapy, ayurveda, homeopathy or other AYUSH degrees, or
    paramedical and allied health science degrees. The university's health
    science provision is pharmacy and cosmetic technology, namely the two year
    Diploma in Pharmacy, the four year Bachelor of Pharmacy, the five year
    B.Pharm plus MBA in Pharma Tech, the four year B.Tech in Cosmetic Technology,
    the two year M.Pharm in four specialisations, and a doctoral programme in
    Pharmaceutical Science. There is no entrance route, fee or seat count for a
    clinical medical programme here. Anyone looking for a medical or dental
    college needs an institution holding the relevant National Medical Commission
    or Dental Council of India approval.
