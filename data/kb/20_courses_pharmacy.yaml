    passed a bachelor's degree in Pharmacy from an Indian university established
    by law, from an institution approved by the Pharmacy Council of India, and
    must have scored not less than fifty five per cent of the maximum marks in
    aggregate over the four years of B.Pharm. The candidate must also hold
    registration with the State Pharmacy Council, or obtain it within one month of
    the date of admission, failing which the admission is cancelled. Selection is
    based on the GPAT score or the PERA test.

