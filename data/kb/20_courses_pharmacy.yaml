    The School of Pharmacy and Technology Management started in the academic year
    2025-26. It offers a two year Diploma in Pharmacy on the annual pattern with
    an intake of sixty, a four year Bachelor of Pharmacy with an intake of sixty,
    a five year B.Pharm plus MBA in Pharma Tech with an intake of forty, and a
    four year B.Tech in Cosmetic Technology with an intake of sixty. At
    postgraduate level the two year M.Pharm has forty eight seats across four
