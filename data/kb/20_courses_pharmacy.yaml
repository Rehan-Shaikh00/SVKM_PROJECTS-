    is full time on campus. On this campus SVKM's Institute of Pharmacy holds an
    A plus grade in its first NAAC cycle with a CGPA of three point four three,
    and the Diploma in Pharmacy programme at SVKM's Institute of Technology holds
    National Board of Accreditation accreditation from the academic year 2024-25
    to 2026-27.

