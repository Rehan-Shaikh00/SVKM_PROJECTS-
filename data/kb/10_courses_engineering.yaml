  structured:
    school: "School of Technology, Management & Engineering"
    levels: ["UG (B.Tech, B.Tech + MBA)", "PG (M.Tech, MCA)", "Doctoral (Ph.D.)"]
    btech_duration_years: 4
    btech_mba_duration_years: 5
    mtech_duration_years: 2
    mca_duration_years: 2
    btech_branches:
      - "Computer Engineering (intake 180)"
      - "Computer Science & Engineering (AI & ML) (intake 120)"
      - "Computer Science & Engineering (Data Science) (intake 120)"
      - "Civil Engineering (intake 60)"
      - "Electrical Engineering (intake 60)"
      - "Mechanical Engineering (intake 60)"
    mtech_branches:
      - "Civil Engineering (intake 12)"
      - "Computer Engineering (intake 12)"
      - "Electrical Engineering (intake 12)"
      - "Mechanical Engineering (intake 12)"
    entrance_exam: "B.Tech and B.Tech + MBA: MHT-CET (PCM), JEE Main, JEE Advanced, NCET (NMIMS-CET), SAT or PERA TEST (PCM). M.Tech: GATE or PERA TEST. MCA: MAH-MCA-CET or PERA TEST (MCA)."
    medium: "English"
    mode: "Full time, on campus"
    school_phone: "02562 350620, 94256 85966, 97644 05069"
  body: |
    The School of Technology, Management and Engineering started in the academic
    year 2025-26. It runs four year B.Tech programmes in Computer Engineering
    with an intake of one hundred and eighty, Computer Science and Engineering in
    Artificial Intelligence and Machine Learning with one hundred and twenty,
    Computer Science and Engineering in Data Science with one hundred and twenty,
    and Civil, Electrical and Mechanical Engineering with sixty seats each. There
    is a five year B.Tech plus MBA in Technology Management in Computer
    Engineering, in Artificial Intelligence and Machine Learning and in Data
    Science, with sixty seats each. At postgraduate level there is a two year
    M.Tech in Civil, Computer, Electrical and Mechanical Engineering with twelve
    seats each, and a two year MCA with one hundred and twenty seats. Doctoral
    research is offered as a Ph.D. in Technology and Engineering. Information
    Technology appears in the university's programme list at undergraduate,
    postgraduate and dual degree level, but the admission handout for this cycle
    does not publish an intake for it. Teaching is in English and every programme
    is full time on campus.

